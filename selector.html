<!DOCTYPE html>
<html lang="pt-br">


<head>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      display: flex;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0e0c17;
      overflow-x: hidden;
    }

    .telaInicial {}

    .telaInicial h1 {
      font-size: 1rem;
      font-family: 'Press Start 2P', monospace;
      display: inline;
      margin: 0 !important;
    }

    .telaInicial span {
      font-size: 1em;
      font-family: 'Press Start 2P', monospace;
      color: #917C8E;
    }

    #telaInicial {
      margin-top: 5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 50px;
      border-radius: 20px;
      width: 50%;
    }

    #jogarButton,
    #rankingButton {
      padding: 15px 40px;
      color: #0e0e0e;
      border-radius: 18px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
      font-size: 0.8em;
      font-weight: 400;
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      font-family: 'Press Start 2P', monospace;
            background: linear-gradient(0deg, rgba(245, 135, 63, 1) 50%, rgba(176, 58, 116, 1) 100%);

    }



    #jogarButton:hover,
    #rankingButton:hover {
      background-color: #555;
      color: white;
    }

    .textoIntermediarios {
      font-size: 0.7rem;
      margin-top: 30px;
      font-family: 'Press Start 2P', monospace;
      text-align: start;
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      /* espaço entre o texto e a linha */
    }

    .textoIntermediarios h5 {
      margin: 0;
      font-size: 0.7rem;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      width: auto;
      /* não ocupa mais 100% */
      white-space: nowrap;
      /* evita que o texto quebre linha */
      flex-shrink: 0;
      /* mantém o tamanho natural do texto */
    }

    .textoIntermediarios .linha {
      height: 1px;
      background-color: #ffffff;
      flex: 1;
      /* ocupa todo o espaço restante */
    }

    .ativo {
      background-color: transparent !important;
      border: 1px solid #E323CA !important;
      color: #E323CA !important;
      font-weight: bold !important;
      margin-bottom: 12px;
      background-color: #260C29 !important;
    }

    .ativo span {
      color: #E323CA !important;
    }

    .musicaEscolhida {
      background-color: transparent !important;
      color: #E323CA !important;
      text-shadow: none !important;
      background-color: #260C29 !important;
      padding: 15px !important;
      border-radius: 12px !important;
      border: 1px solid #E323CA !important;
    }

    .titulo {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.3rem !important;
      text-shadow: none !important;
      color: white;

    }

    button {
      background-color: transparent;
      border: none;
      cursor: pointer;
    }

    .musicaEscolhida h5 {
      color: #E323CA !important;
      font-family: 'Press Start 2P', monospace;
      margin-top: 8px;
      font-size: 0.7em;
    }

    .musicaEscolhida span {
      color: #64fedd !important;
      font-family: 'Press Start 2P', monospace;
      font-size: 1em;
    }
     .musicaEscolhida svg {
      color: #E323CA !important;
  
    }

    .musicaEscolhida.text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
 #buttons h1 {
    
  
      font-size: 0.75rem;
    }
    #buttons h5 {
      color: #917C8E;
      font-family: 'Press Start 2P', monospace;
      margin-top: 8px;
      font-size: 0.7em;
    }

    #buttons div {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    #buttons svg {
      color: #917C8E;
    }



    #area {
      position: absolute;
      /* era fixed — isso quebra tudo */
      background-color: rgba(28, 231, 187, 0.75);
      top: 0;
      height: 100%;
      opacity: 0.5;
      pointer-events: none;
      transition: left 0.35s ease, width 0.35s ease;
    }

    #pianoImg {
      margin-bottom: 10px;
      z-index: 0;
      width: 100%;
    }

    a {
      display: inline;
    }

    #buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .fase-card {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      color: #917C8E;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 12px;
      background-color: #160519;
      text-align: left;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }

    .fase-card:hover,
    .fase-card.fase-selecionada {
      border-color: #E323CA;
      background-color: #260C29;
      color: #ffffff;
    }

    .fase-card h1 {
      margin: 0;
      color: inherit;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    .fase-card span {
      display: block;
      margin-top: 8px;
      color: #64fedd;
      font-size: 0.6rem;
    }

    #inicialButtons {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      justify-content: center;
      width: 100%;
    }

    #inicialButtons button {
      color: #0e0e0e;
    }



   

    @keyframes rankingPiscar {

      0%,
      100% {
        color: white;
      }

      50% {
        color: #E323CA;
      }
    }

    #rankingModalBox {
      background: #0B0912;
      border: 1px solid #E323CA;
      border-radius: 16px;
      width: 460px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 28px 24px;
      color: white;
      font-family: 'Press Start 2P', monospace;
    }

    #rankingModalHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #rankingModalTitulo {
      font-size: 0.85rem;
      color: #E323CA;
    }

    #rankingFecharBtn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    #rankingFecharBtn:hover {
      color: white;
    }

    #rankingModalFiltros {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    #rankingModalMusica {
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.6);
      flex: 1;
      line-height: 1.4;
    }

    #rankingModalModos {
      display: flex;
      gap: 8px;
    }

    #rankingModalModoAtual {
      font-size: 0.45rem;
      color: #E323CA;
      border: 1px solid #E323CA;
      border-radius: 20px;
      padding: 4px 12px;
      white-space: nowrap;
    }

    #rankingModalLista {
      list-style: none;
      padding: 0;
      margin: 0 0 8px;
    }

    #rankingModalLista li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    #rankingModalLista li:first-child {
      background: rgba(227, 35, 202, 0.12);
    }

    #rankingModalLista li:nth-child(2) {
      background: rgba(227, 35, 202, 0.07);
    }

    #rankingModalLista li:nth-child(3) {
      background: rgba(227, 35, 202, 0.04);
    }

    .rm-pos {
      min-width: 26px;
      color: #E323CA;
      font-weight: 700;
    }

    .rm-nome {
      flex: 1;
    }

    .rm-pts {
      color: #64fedd;
      min-width: 48px;
      text-align: right;
    }

    .rm-data {
      min-width: 60px;
      text-align: right;
      font-size: 0.4rem;
      opacity: 0.5;
    }

    #rankingModalVazio {
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      margin: 20px 0 0;
      display: none;
    }

    @media (max-width: 768px) {
      body {
        width: 100vw;
        overflow-x: hidden;
      }

      #telaInicial {
        padding: 24px 16px;
        margin-top: 10px;
        width: calc(100vw - 24px);
      }

      .buttons {
        flex-direction: column;
        gap: 8px;
      }

      .buttons button {
        width: 100%;
        font-size: clamp(0.6em, 2vw, 0.8em);
      }

      .buttons button h1 {
        font-size: clamp(0.7rem, 3vw, 1rem);
        margin: 5px 0;

      }

      .buttons button span {
        font-size: clamp(0.5rem, 2vw, 0.8rem);
      }

      #pianoImg {
        width: 100%;
        overflow-x: auto;
      }

      #pianoImg img {
        max-width: 100%;
        height: auto;
        display: block;
      }


      #inicialButtons {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      #inicialButtons button {
        width: 100%;
        padding: 10px 20px;
        font-size: clamp(0.6em, 2vw, 0.8em);
      }

      #rankingButton {
        font-size: clamp(0.5em, 2vw, 0.6em);
        margin: 15px 0;
      }

      h5 {
        font-size: clamp(0.5rem, 2vw, 1rem);
      }

      .titulo {
    font-size: 1rem !important;
    line-height: 1.5;
  }

  .fase-card h1,
  #littlestar h1,
  #elvis h1,
  #bethoven h1,
  #tchai h1 {
    font-size: 0.5rem !important;
    line-height: 1.7;
  }

  .fase-card h5,
  #littlestar h5,
  #elvis h5,
  #bethoven h5,
  #tchai h5 {
    font-size: 0.38rem !important;
    line-height: 1.5;
  }

  .fase-card span,
  #littlestar span,
  #elvis span,
  #bethoven span,
  #tchai span {
    font-size: 0.35rem !important;
  }

  #jogarButton,
  #rankingButton {
    font-size: 0.45rem;
  }

  .textoIntermediarios h5 {
    font-size: 0.45rem;
  }
    }

    @media (max-width: 480px) {
      body {
        width: 100vw;
        padding: 0;
      }
#rankingButton {
        font-size: clamp(0.5em, 2vw, 0.6em);
        margin: 0;
      }
      #telaInicial {
        padding: 18px 12px;
        margin-top: 5px;
        width: calc(100vw - 16px);
        border-radius: 10px;
      }

      .titulo {
        font-size: clamp(0.8rem, 4vw, 1.5rem);
        word-break: break-word;
      }

      .buttons {
        width: 100%;
        flex-direction: column;
        margin-bottom: 10px;
      }

      .buttons button {
        width: 100%;
        font-size: 0.5rem;
        text-align: left;
        line-height: 1.5;
        padding: 12px;
      }

      .buttons a {
        width: 30px;
      }

   

      .buttons a img {
        width: 15px;
      }



      #pianoImg h5 {
        font-size: 0.6rem;
      }

      #rankingModalBox {
        width: 95vw;
        padding: 16px 12px;
      }

      #rankingModalTitulo {
        font-size: 0.7rem;
      }

      #rankingModalMusica {
        font-size: 0.45rem;
      }

      #inicialButtons {
        flex-direction: column;
        height: auto;
      }

      #inicialButtons button {
        flex: 1 1 auto;
        width: 100%;
      }

      #rankingModalModoAtual {
        font-size: 0.4rem;
        padding: 3px 8px;
      }

      #rankingModalLista li {
        font-size: 0.45rem;
        padding: 6px 8px;
      }
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const faseAndamentoButton = document.getElementById("faseAndamentoButton");
      const faseOitavasButton = document.getElementById("faseOitavasButton");
      const faseNotasButton = document.getElementById("faseNotasButton");
      const iniciarButton = document.getElementById("jogarButton");
      let faseSelecionada = "andamento";

      function selecionarFase(fase) {
        faseSelecionada = fase;
        faseOitavasButton.classList.toggle("fase-selecionada", fase === "oitavas");
        faseAndamentoButton.classList.toggle("fase-selecionada", fase === "andamento");
        faseNotasButton.classList.toggle("fase-selecionada", fase === "notas");
      }

      faseAndamentoButton.addEventListener("click", () => selecionarFase("andamento"));
      faseOitavasButton.addEventListener("click", () => selecionarFase("oitavas"));
      faseNotasButton.addEventListener("click", () => selecionarFase("notas"));
      iniciarButton.addEventListener("click", () => {
        localStorage.setItem("musica", "jinglebell");
        localStorage.setItem("faseJogo", faseSelecionada);
        window.location.href = "game.html";
      });
      selecionarFase(faseSelecionada);
    });
  </script>


</head>

<body>
  <div id="telaInicial" class="telaInicial">
    <div id="titulo" style="margin-bottom: 20px;">
      <h1 class="titulo">SELECIONE UMA FASE</h1><br>
    </div>
    <div id="buttons">
      <button id="faseAndamentoButton" class="fase-card" type="button">
        <div><h1>1ª FASE - ANDAMENTO</h1></div>
      </button>
      <button id="faseOitavasButton" class="fase-card" type="button">
        <div><h1>2ª FASE - OITAVAS</h1></div>
      </button>
      <button id="faseNotasButton" class="fase-card" type="button">
        <div><h1>3ª FASE - NOTAS MUSICAIS</h1></div>
      </button>
    </div>

    <div id="inicialButtons">
      <button id="jogarButton">INICIAR</button>
    </div>
  </div>
</body>

</html>
