<!DOCTYPE html>
<html lang="pt-br">


<head>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      display: flex;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0e0c17;
      overflow-x: hidden;
    }

    .telaInicial {}

    .telaInicial h1 {
      font-size: 1rem;
      font-family: 'Press Start 2P', monospace;
      display: inline;
      margin: 0 !important;
    }

    .telaInicial span {
      font-size: 1em;
      font-family: 'Press Start 2P', monospace;
      color: #917C8E;
    }

    #telaInicial {
      margin-top: 5vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 50px;
      border-radius: 20px;
      width: 50%;
    }

    #jogarButton,
    #autoplayButton, #rankingButton {
      padding: 15px 40px;
      color: #0e0e0e;
      border-radius: 18px;
      cursor: pointer;
      transition: background-color 0.3s, color 0.3s;
      font-size: 0.8em;
      font-weight: 400;
      border: none;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      font-family: 'Press Start 2P', monospace;
            background: linear-gradient(0deg, rgba(245, 135, 63, 1) 50%, rgba(176, 58, 116, 1) 100%);

    }



    #autoplayButton:hover,
    #jogarButton:hover, #rankingButton:hover {
      background-color: #555;
      color: white;
    }

    .textoIntermediarios {
      font-size: 0.7rem;
      margin-top: 30px;
      font-family: 'Press Start 2P', monospace;
      text-align: start;
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      /* espaço entre o texto e a linha */
    }

    .textoIntermediarios h5 {
      margin: 0;
      font-size: 0.7rem;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      width: auto;
      /* não ocupa mais 100% */
      white-space: nowrap;
      /* evita que o texto quebre linha */
      flex-shrink: 0;
      /* mantém o tamanho natural do texto */
    }

    .textoIntermediarios .linha {
      height: 1px;
      background-color: #ffffff;
      flex: 1;
      /* ocupa todo o espaço restante */
    }

    .ativo {
      background-color: transparent !important;
      border: 1px solid #E323CA !important;
      color: #E323CA !important;
      font-weight: bold !important;
      margin-bottom: 12px;
      background-color: #260C29 !important;
    }

    .ativo span {
      color: #E323CA !important;
    }

    .musicaEscolhida {
      background-color: transparent !important;
      color: #E323CA !important;
      text-shadow: none !important;
      background-color: #260C29 !important;
      padding: 15px !important;
      border-radius: 12px !important;
      border: 1px solid #E323CA !important;
    }

    .titulo {
      font-family: 'Press Start 2P', monospace;
      font-size: 2.3rem !important;
      text-shadow: none !important;
      color: white;

    }

    button {
      background-color: transparent;
      border: none;
      cursor: pointer;
    }

    .musicaEscolhida h5 {
      color: #E323CA !important;
      font-family: 'Press Start 2P', monospace;
      margin-top: 8px;
      font-size: 0.7em;
    }

    .musicaEscolhida span {
      color: #64fedd !important;
      font-family: 'Press Start 2P', monospace;
      font-size: 1em;
    }
     .musicaEscolhida svg {
      color: #E323CA !important;
  
    }

    .musicaEscolhida.text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
 #buttons h1 {
    
  
      font-size: 0.75rem;
    }
    #buttons h5 {
      color: #917C8E;
      font-family: 'Press Start 2P', monospace;
      margin-top: 8px;
      font-size: 0.7em;
    }

    #buttons div {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    #buttons svg {
      color: #917C8E;
    }



    #area {
      position: absolute;
      /* era fixed — isso quebra tudo */
      background-color: rgba(28, 231, 187, 0.75);
      top: 0;
      height: 100%;
      opacity: 0.5;
      pointer-events: none;
      transition: left 0.35s ease, width 0.35s ease;
    }

    #pianoImg {
      margin-bottom: 10px;
      z-index: 0;
      width: 100%;
    }

    a {
      display: inline;
    }

    #buttons {
      display: flex;
      width: 100%;

    }

    #elvis,
    #tchai,
    #bethoven,
    #littlestar,
    #jinglebell {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #917C8E;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      font-size: 0.7rem;
      background-color: #160519;
    }

    #modoContainer {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      justify-content: center;
      width: 100%;
    }

    .botaoModo {
      padding: 15px;
      width: 100%;
      height: 70px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'Press Start 2P', monospace;
      background-color: transparent;
      color: #917C8E;
      display: flex;
      align-items: flex-start;
      flex-direction: column;
      justify-content: center;
    }

    .botaoModo,
    h5 {
      margin-bottom: 5px;
      margin-top: 0px;
      font-size: 0.8rem;
    }

        .botaoModo,
    span {
      font-size: 0.5rem;
    }

    .botaoModo:hover {
      transform: scale(1.05);

    }



    #inicialButtons {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      justify-content: space-between;
      width: 100%;
    }

    #inicialButtons button {
      color: #0e0e0e;
    }



   

    @keyframes rankingPiscar {

      0%,
      100% {
        color: white;
      }

      50% {
        color: #E323CA;
      }
    }

    #rankingModalBox {
      background: #0B0912;
      border: 1px solid #E323CA;
      border-radius: 16px;

      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      padding: 28px 28px 24px;
      color: white;
      font-family: 'Press Start 2P', monospace;
    }

    #rankingModalHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    #rankingModalTitulo {
      font-size: 0.85rem;
      color: #E323CA;
    }

    #rankingFecharBtn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    #rankingFecharBtn:hover {
      color: white;
    }

    #rankingModalFiltros {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
    }

    #rankingModalMusica {
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.6);
      flex: 1;
      line-height: 1.4;
    }

    #rankingModalModos {
      display: flex;
      gap: 8px;
    }

    #rankingModalModoAtual {
      font-size: 0.45rem;
      color: #E323CA;
      border: 1px solid #E323CA;
      border-radius: 20px;
      padding: 4px 12px;
      white-space: nowrap;
    }

    #rankingModalLista {
      list-style: none;
      padding: 0;
      margin: 0 0 8px;
    }

    #rankingModalLista li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    #rankingModalLista li:first-child {
      background: rgba(227, 35, 202, 0.12);
    }

    #rankingModalLista li:nth-child(2) {
      background: rgba(227, 35, 202, 0.07);
    }

    #rankingModalLista li:nth-child(3) {
      background: rgba(227, 35, 202, 0.04);
    }

    .rm-pos {
      min-width: 26px;
      color: #E323CA;
      font-weight: 700;
    }

    .rm-nome {
      flex: 1;
    }

    .rm-pts {
      color: #64fedd;
      min-width: 48px;
      text-align: right;
    }

    .rm-data {
      min-width: 60px;
      text-align: right;
      font-size: 0.4rem;
      opacity: 0.5;
    }

    #rankingModalVazio {
      font-size: 0.5rem;
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      margin: 20px 0 0;
      display: none;
    }

    @media (max-width: 768px) {

        width: 100vw;
        overflow-x: hidden;
      }

        margin-top: 10px;

      }

      .buttons {
        flex-direction: column;
        gap: 8px;
      }

      .buttons button {
        width: 100%;
        font-size: clamp(0.6em, 2vw, 0.8em);
      }

      .buttons button h1 {
        font-size: clamp(0.7rem, 3vw, 1rem);
        margin: 5px 0;

      }

      .buttons button span {
        font-size: clamp(0.5rem, 2vw, 0.8rem);
      }

      #modoContainer {
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }

      .botaoModo {
        width: 100%;
        height: auto;
        padding: 10px 5px;
        font-size: clamp(0.5em, 2vw, 0.8em);
      }

      .botaoModo h5 {
        margin: 3px 0;
        font-size: clamp(0.5em, 2vw, 0.8em);
      }

      .botaoModo small {
        font-size: clamp(0.3em, 1.5vw, 0.6em) !important;
      }

      #pianoImg {
        width: 100%;
        overflow-x: auto;
      }

      #pianoImg img {
        max-width: 100%;
        height: auto;
        display: block;
      }


      #inicialButtons {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }

      #inicialButtons button {
        width: 100%;
        padding: 10px 20px;
        font-size: clamp(0.6em, 2vw, 0.8em);
      }

      #rankingButton {
        font-size: clamp(0.5em, 2vw, 0.6em);
        margin: 15px 0;
      }

      h5 {
        font-size: clamp(0.5rem, 2vw, 1rem);
      }

      .titulo {
    font-size: 1rem !important;
    line-height: 1.5;
  }

  #jinglebell h1,
  #littlestar h1,
  #elvis h1,
  #bethoven h1,
  #tchai h1 {
    font-size: 0.5rem !important;
    line-height: 1.7;
  }

  #jinglebell h5,
  #littlestar h5,
  #elvis h5,
  #bethoven h5,
  #tchai h5 {
    font-size: 0.38rem !important;
    line-height: 1.5;
  }

  #jinglebell span,
  #littlestar span,
  #elvis span,
  #bethoven span,
  #tchai span {
    font-size: 0.35rem !important;
  }

  .botaoModo h5 {
    font-size: 0.45rem !important;
  }

  .botaoModo span {
    font-size: 0.3rem !important;
  }

  #jogarButton,
  #autoplayButton,
  #rankingButton {
    font-size: 0.45rem;
  }

  .textoIntermediarios h5 {
    font-size: 0.45rem;
  }
    }

    @media (max-width: 480px) {
      body {
        width: 100vw;
        padding: 0;
      }
#rankingButton {
        font-size: clamp(0.5em, 2vw, 0.6em);
        margin: 0;
      }
      #telaInicial {
        padding: 18px 12px;
        margin-top: 5px;
        width: calc(100vw - 16px);
        border-radius: 10px;
      }

      .titulo {
        font-size: clamp(0.8rem, 4vw, 1.5rem);
        word-break: break-word;
      }

      .buttons {
        width: 100%;
        flex-direction: column;
        margin-bottom: 10px;
      }

      .buttons button {
        width: 100%;
        font-size: 0.5rem;

        line-height: 1.5;
        padding: 12px;
      }

      .buttons a {
        width: 30px;
      }

   

      .buttons a img {
        width: 15px;
      }

      #modoContainer {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .botaoModo {
        width: 100%;
        min-height: 56px;
        height: auto;
        font-size: 0.8rem;
      }




      #pianoImg h5 {
        font-size: 0.6rem;
      }

      #rankingModalBox {
        width: 95vw;
        padding: 16px 12px;
      }

      #rankingModalTitulo {
        font-size: 0.7rem;
      }

      #rankingModalMusica {

      }

      #inicialButtons {
        flex-direction: column;
        height: auto;
      }

      #inicialButtons button {
        flex: 1 1 auto;
        width: 100%;
      }

      #rankingModalModoAtual {
        font-size: 0.4rem;
        padding: 3px 8px;
      }

      #rankingModalLista li {
        font-size: 0.45rem;
        padding: 6px 8px;
      }
    }
  </style>
  <script>
    let musica = null;
    let modo = "jogador"; // Modo padrão é "jogador"

    document.addEventListener("DOMContentLoaded", () => {
      // Referencias aos elementos de música
      const obterMusica = (id) => document.getElementById(id) || document.createElement("button");
      const littlestarMusic = obterMusica("littlestar");
      const elvisMusic = obterMusica("elvis");
      const bethovenMusic = obterMusica("bethoven");
      const tchaiMusic = obterMusica("tchai");
      const jinglebellMusic = obterMusica("jinglebell");

      const area = document.getElementById("area");

      // Referências aos botões de modo
      const botaoAprendiz = document.getElementById("botaoAprendiz");
      const botaoJogador = document.getElementById("botaoJogador");

      // Referências aos botões de ação
      const jogarButton = document.getElementById("jogarButton");
      const autoplayButton = document.getElementById("autoplayButton");

      const PIANO_W = 722;

      function setArea(leftPx, widthPx) {
        area.style.left = (leftPx / PIANO_W * 100) + "%";
        area.style.width = (widthPx / PIANO_W * 100) + "%";
      }



      // Recuperar modo do localStorage se existir
      const modoSalvo = localStorage.getItem("modoSelecionado");
      if (modoSalvo) {
        modo = modoSalvo;
      }

      // Inicializar estado dos botões de modo
      atualizarEstadoBotoesModo();

      musica = "jinglebell";
      [littlestarMusic, elvisMusic, bethovenMusic, tchaiMusic]
        .filter((element) => element.isConnected)
        .forEach((element) => element.classList.remove("musicaEscolhida"));
      jinglebellMusic.classList.add("musicaEscolhida");

      setArea(333, 111);

      // Event listeners para seleção de modo
      botaoAprendiz.addEventListener("click", () => {
        modo = "aprendiz";
        localStorage.setItem("modoSelecionado", "aprendiz");
        atualizarEstadoBotoesModo();
      });

      botaoJogador.addEventListener("click", () => {
        modo = "jogador";
        localStorage.setItem("modoSelecionado", "jogador");
        atualizarEstadoBotoesModo();
      });

      // Event listeners para seleção de música
      elvisMusic.addEventListener("click", () => {
        musica = "elvis"
        bethovenMusic.classList.remove("musicaEscolhida")
        tchaiMusic.classList.remove("musicaEscolhida")
        littlestarMusic.classList.remove("musicaEscolhida")
        elvisMusic.classList.add("musicaEscolhida");
        jinglebellMusic.classList.remove("musicaEscolhida");
        setArea(250, 208);
      })

      bethovenMusic.addEventListener("click", () => {
        musica = "bethoven"
        bethovenMusic.classList.add("musicaEscolhida");
        elvisMusic.classList.remove("musicaEscolhida");
        tchaiMusic.classList.remove("musicaEscolhida");
        littlestarMusic.classList.remove("musicaEscolhida");
        jinglebellMusic.classList.remove("musicaEscolhida");
        setArea(208, 181);
      })

      tchaiMusic.addEventListener("click", () => {
        musica = "tchai"
        tchaiMusic.classList.add("musicaEscolhida")
        bethovenMusic.classList.remove("musicaEscolhida");
        elvisMusic.classList.remove("musicaEscolhida");
        littlestarMusic.classList.remove("musicaEscolhida");
        jinglebellMusic.classList.remove("musicaEscolhida");
        setArea(360, 153);
      })

      littlestarMusic.addEventListener("click", () => {
        musica = "littlestar"
        littlestarMusic.classList.add("musicaEscolhida")
        bethovenMusic.classList.remove("musicaEscolhida");
        elvisMusic.classList.remove("musicaEscolhida");
        tchaiMusic.classList.remove("musicaEscolhida");
        jinglebellMusic.classList.remove("musicaEscolhida");
        setArea(180, 223);
      })
      jinglebellMusic.addEventListener("click", () => {
        musica = "jinglebell"
        jinglebellMusic.classList.add("musicaEscolhida")
        bethovenMusic.classList.remove("musicaEscolhida");
        elvisMusic.classList.remove("musicaEscolhida");
        tchaiMusic.classList.remove("musicaEscolhida");
        littlestarMusic.classList.remove("musicaEscolhida");
        setArea(333, 111);
      })


      jogarButton.addEventListener("click", () => {
        if (musica) {
          localStorage.setItem("musica", musica);
          localStorage.setItem("modo", "jogar");
          localStorage.setItem("modoMusica", modo);
          window.location.href = "game.html";
        } else {
          alert("Selecione uma música!");
        }
      });

      autoplayButton.addEventListener("click", () => {
        if (musica) {
          localStorage.setItem("musica", musica);
          localStorage.setItem("modo", "autoplay");
          localStorage.setItem("modoMusica", modo);
          window.location.href = "game.html";
        } else {
          alert("Selecione uma música!");
        }
      });

      function atualizarEstadoBotoesModo() {
        if (modo === "aprendiz") {
          botaoAprendiz.classList.add("ativo");
          botaoJogador.classList.remove("ativo");
        } else {
          botaoJogador.classList.add("ativo");
          botaoAprendiz.classList.remove("ativo");
        }
      }
    });
  </script>


</head>

<body>

    <div id="titulo" style="margin-bottom: 20px;">
      <h1 class="titulo">SELECIONE UMA MÚSICA</h1><br>
    </div>
<div id="buttons">
      <button id="jinglebell">

        </div>

          <a id="playJingleBell" href="https://www.youtube.com/watch?v=nIhs1T7OcZg" target="_blank">

            <svg viewBox="0 0 100 100" width="25" height="25">
              <path d="M30,25 Q30,15 38.43,20.37
             L76.57,44.63
             Q85,50 76.57,55.37
             L38.43,79.63
             Q30,85 30,75 Z" fill="currentColor"  />
            </svg>

          </a>
        </div>
      </button>
    </div>
    
    <div class="textoIntermediarios">
      
      <h5>Modo de jogo</h5>
      <div class="linha"></div>
    </div>
    <div id="modoContainer">
      <button id="botaoAprendiz" class="botaoModo">

         <span> para treinar</span>

      </button>
      <button id="botaoJogador" class="botaoModo">

      </button>
    </div>

    <div id="pianoImg">

        <div class="linha"></div>
      </div>
      <div style="position: relative; display: block; width: 100%;">
        <div id="area"></div>
        <img src="./assets/piano-completo-test.png"

      </div>
    </div>
    
    <div id="inicialButtons">
      <button id="jogarButton">JOGAR</button>
      <button id="autoplayButton">AUTOPLAY</button>
    </div>
  </div>
</body>
